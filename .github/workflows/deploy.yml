name: Push Notes

on:
  push:
    branches:
      - master
    paths:
      - "latex_target/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-data-analysis
  cancel-in-progress: false

permissions:
  contents: read

env:
  NOTES_PROJECT: data-analysis
  NOTES_SERVER_ROOT: https://notes.rua.rs

jobs:
  deploy:
    name: Deploy data-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger notes server deployment
        env:
          NOTES_DEPLOY_KEY: ${{ secrets.NOTES_DEPLOY_KEY }}
        run: |
          if [ -z "$NOTES_DEPLOY_KEY" ]; then
            echo "The NOTES_DEPLOY_KEY repository secret is not configured."
            exit 1
          fi

          notes_deploy_key="${NOTES_DEPLOY_KEY//$'\r'/}"
          notes_deploy_key="${notes_deploy_key//$'\n'/}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 180 \
            --request POST \
            --header "x-api-key: $notes_deploy_key" \
            "$NOTES_SERVER_ROOT/deploy/$NOTES_PROJECT"

      - name: Verify deployed course
        run: |
          course_page="$(mktemp)"
          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --output "$course_page" \
            "$NOTES_SERVER_ROOT/$NOTES_PROJECT"

          if ! grep --quiet "lec01.pdf" "$course_page"; then
            echo "lec01.pdf is missing from the course page."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --output /dev/null \
            "$NOTES_SERVER_ROOT/$NOTES_PROJECT/lec01.pdf"
